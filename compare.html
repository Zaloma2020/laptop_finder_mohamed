<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare - Student Laptop Finder</title>
  <script>
    // Applies the saved theme before the page paints, so there is no flash on reload.
    try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("lf_theme")) || "performance"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="dist/output.css">
</head>
<body class="flex min-h-screen flex-col bg-page text-ink antialiased transition-colors duration-200">
  <header id="site-header" class="sticky top-0 z-40 border-b border-line bg-page"></header>

  <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-8 sm:px-6 lg:px-8">
    <h1 class="text-3xl font-extrabold sm:text-4xl">Compare laptops</h1>
    <p class="mt-2 text-muted">Choose two to four of your favorites. The best value in each row is highlighted.</p>

    <section class="mt-6" aria-labelledby="picker-title">
      <h2 id="picker-title" class="mb-3 text-xl font-bold">Your favorites</h2>
      <div id="picker" class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4"></div>
      <p id="compare-message" class="mt-3 min-h-6 text-sm font-semibold text-accent" role="alert"></p>
    </section>

    <section class="mt-6" aria-labelledby="result-title">
      <h2 id="result-title" class="mb-3 text-xl font-bold">Side by side</h2>
      <div id="compare-result"></div>
    </section>
  </main>

  <footer id="site-footer" class="border-t border-line"></footer>
  <script type="module" src="src/js/comparePage.js"></script>
</body>
</html>
